name: ci

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (not floating tags). Review these
      # periodically or automate with a pinning-aware update tool.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26.6" # matches the toolchain in go.mod
          cache: true

      - name: gofmt (check only)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code

      - name: Whitespace / conflict-marker check
        run: git diff --check

      - name: go vet
        run: go vet ./...

      - name: Unit and integration tests
        run: go test ./... -count=1

      - name: Race detector
        run: go test -race ./... -count=1 -timeout=10m

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Secret pattern scan
        run: bash scripts/secret-scan.sh
