version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell    # common spelling mistakes in comments/strings
    - unconvert   # redundant type conversions
    - revive      # style/lint checks (golint successor)
  # Note: bodyclose is intentionally NOT enabled. Response bodies in
  # pkg/client are closed inside parse()/decodeAPIError() helpers, which
  # bodyclose cannot trace through, producing false positives. errcheck
  # already enforces that Close() error values are handled where visible.
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # doc comments are covered by review, not enforced here

formatters:
  enable:
    - gofmt
